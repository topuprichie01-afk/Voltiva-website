
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voltiva | Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f3f7ff;min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:white;padding:30px 25px;border-radius:15px;width:100%;max-width:400px;box-shadow:0 5px 25px #0001}
h1{text-align:center;color:#0866d9;margin-bottom:10px}
p{text-align:center;color:#666;margin:15px 0}
label{display:block;font-weight:bold;margin:15px 0 7px}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:100%;padding:14px;margin-top:18px;background:#0866d9;color:white;border:0;border-radius:8px;font-weight:bold;font-size:16px}
a{color:#0866d9;text-decoration:none;font-weight:bold}
#message{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="box">
<h1>Voltiva</h1>
<p>Login to your account</p>

<form id="login-form">
<label for="email">Email address</label>
<input id="email" type="email" required placeholder="Enter your email">

<label for="password">Password</label>
<input id="password" type="password" required placeholder="Enter your password">

<p style="text-align:right;margin:8px 0">
<a href="forgot-password.html">Forgot Password?</a>
</p>

<button id="login-button" type="submit">Log In</button>
</form>

<p id="message" role="status" aria-live="polite"></p>
<p>Don't have an account? <a href="signup.html">Create Account</a></p>
</div>

<script type="module">
import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://eoadvcorimdpriqzmcux.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_pikDlVHyj8WV-EBv7b2v0Q_YmW0v75i";
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const form = document.getElementById("login-form");
const message = document.getElementById("message");
const button = document.getElementById("login-button");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  button.disabled = true;
  button.textContent = "Logging in...";
  message.textContent = "";

  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });

    if (error) throw error;
    if (!data.session) throw new Error("Login session was not created.");

    message.style.color = "green";
    message.textContent = "Login successful!";
    window.location.href = "dashboard.html";
  } catch (error) {
    message.style.color = "#d62828";
    message.textContent = error.message || "Login failed.";
    button.disabled = false;
    button.textContent = "Log In";
  }
});
</script>
</body>
</html>
