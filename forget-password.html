
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voltiva | Forgot Password</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f3f7ff;min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:white;padding:28px;border-radius:15px;width:100%;max-width:400px;box-shadow:0 5px 25px #0001}
h1{text-align:center;color:#0866d9}
p{text-align:center;color:#666;margin:15px 0}
label{display:block;font-weight:bold;margin:15px 0 7px}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:100%;padding:14px;margin-top:18px;background:#0866d9;color:white;border:0;border-radius:8px;font-weight:bold;font-size:16px}
a{color:#0866d9;text-decoration:none;font-weight:bold}
#message{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="box">
<h1>Voltiva</h1>
<p>Reset your password</p>

<form id="email-form">
<label for="email">Your registered email</label>
<input id="email" type="email" required placeholder="Enter your email">
<button id="send-button" type="submit">Send Recovery Code</button>
</form>

<div id="reset-area" hidden>
<label for="token">Recovery code</label>
<input id="token" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter email code">

<label for="new-password">New password</label>
<input id="new-password" type="password" minlength="6" placeholder="Enter new password">

<label for="confirm-password">Confirm new password</label>
<input id="confirm-password" type="password" minlength="6" placeholder="Confirm new password">

<button id="reset-button" type="button">Verify Code & Change Password</button>
</div>

<p id="message" role="status" aria-live="polite"></p>
<p><a href="login.html">Back to Login</a></p>
</div>

<script type="module">
import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://eoadvcorimdpriqzmcux.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_pikDlVHyj8WV-EBv7b2v0Q_YmW0v75i";
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const emailForm = document.getElementById("email-form");
const emailInput = document.getElementById("email");
const resetArea = document.getElementById("reset-area");
const message = document.getElementById("message");

emailForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = document.getElementById("send-button");
  button.disabled = true;
  message.textContent = "Sending recovery code...";

  try {
    const { error } = await supabase.auth.resetPasswordForEmail(
      emailInput.value.trim()
    );

    if (error) throw error;

    resetArea.hidden = false;
    emailForm.hidden = true;
    message.textContent = "If the account is eligible, a recovery code has been sent. Check your email.";
  } catch (error) {
    message.textContent = error.message || "Could not send recovery code.";
    button.disabled = false;
  }
});

document.getElementById("reset-button").addEventListener("click", async () => {
  const token = document.getElementById("token").value.trim();
  const password = document.getElementById("new-password").value;
  const confirmation = document.getElementById("confirm-password").value;
  const button = document.getElementById("reset-button");

  if (!token) {
    message.textContent = "Enter the recovery code from your email.";
    return;
  }

  if (password.length < 6) {
    message.textContent = "Your password must be at least 6 characters.";
    return;
  }

  if (password !== confirmation) {
    message.textContent = "Your passwords do not match.";
    return;
  }

  button.disabled = true;
  message.textContent = "Verifying code...";

  try {
    const { error: verifyError } = await supabase.auth.verifyOtp({
      email: emailInput.value.trim(),
      token,
      type: "recovery"
    });

    if (verifyError) throw verifyError;

    const { error: updateError } = await supabase.auth.updateUser({
      password
    });

    if (updateError) throw updateError;

    message.style.color = "green";
    message.textContent = "Password changed successfully! You can now log in.";
    resetArea.hidden = true;
    setTimeout(() => {
      window.location.href = "login.html";
    }, 2000);
  } catch (error) {
    message.style.color = "#d62828";
    message.textContent = error.message || "Password reset failed. Check your code and try again.";
    button.disabled = false;
  }
});
</script>
</body>
</html>
