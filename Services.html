<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voltiva | Services</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f7ff;
      color: #14213d;
    }
    main {
      max-width: 620px;
      margin: 0 auto;
      padding: 24px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 28px #173b7518;
    }
    h1 { color: #1458c7; margin-top: 0; }
    label { display: block; margin: 14px 0 6px; font-weight: 700; }
    input, select, button {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd6e8;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      margin-top: 20px;
      border: 0;
      background: #1458c7;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    .note { color: #5b6780; font-size: 14px; line-height: 1.5; }
    #message { margin-top: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Voltiva Services</h1>
    <p class="note">Choose one of the four available services.</p>

    <form id="orderForm">
      <label for="service">Service</label>
      <select id="service" name="service" required>
        <option value="">Select a service</option>
        <option value="airtime">Airtime</option>
        <option value="data">Data Bundle</option>
        <option value="cable">Cable TV</option>
        <option value="electricity">Electricity</option>
      </select>

      <div id="providerField">
        <label for="provider">Network / Provider</label>
        <input id="provider" name="provider" placeholder="e.g. MTN, Airtel, GOTV">
      </div>

      <div id="phoneField">
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" inputmode="numeric" placeholder="Phone number">
      </div>

      <div id="accountField" hidden>
        <label for="account">Smart-card / Meter number</label>
        <input id="account" name="account" inputmode="numeric" placeholder="Enter account number">
      </div>

      <div id="meterTypeField" hidden>
        <label for="meterType">Meter type</label>
        <select id="meterType" name="meterType">
          <option value="">Select meter type</option>
          <option value="prepaid">Prepaid</option>
          <option value="postpaid">Postpaid</option>
        </select>
      </div>

      <label for="amount">Amount (₦)</label>
      <input id="amount" name="amount" type="number" min="1" step="1" required>

      <button type="submit">Continue</button>
      <p id="message" role="status"></p>
      <p class="note">Payment processing is not connected yet. No payment will be taken from this page.</p>
    </form>
  </main>

  <script>
    const service = document.getElementById("service");
    const providerField = document.getElementById("providerField");
    const phoneField = document.getElementById("phoneField");
    const accountField = document.getElementById("accountField");
    const meterTypeField = document.getElementById("meterTypeField");
    const provider = document.getElementById("provider");
    const phone = document.getElementById("phone");
    const account = document.getElementById("account");
    const meterType = document.getElementById("meterType");
    const message = document.getElementById("message");

    function updateFields() {
      const selected = service.value;
      const isCable = selected === "cable";
      const isElectricity = selected === "electricity";
      const isUtility = isCable || isElectricity;

      providerField.hidden = isElectricity;
      phoneField.hidden = isUtility;
      accountField.hidden = !isUtility;
      meterTypeField.hidden = !isElectricity;

      provider.required = !isElectricity && selected !== "";
      phone.required = !isUtility && selected !== "";
      account.required = isUtility;
      meterType.required = isElectricity;
      account.placeholder = isCable ? "Smart-card number" : "Meter number";
    }

    service.addEventListener("change", updateFields);

    document.getElementById("orderForm").addEventListener("submit", function (event) {
      event.preventDefault();
      message.textContent =
        "The form is ready, but Paybeta checkout still needs to be connected through the secure Vercel backend.";
    });

    updateFields();
  </script>
</body>
</html>
