
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voltiva | Place Order</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #100d19;
      color: white;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 520px;
      margin: 25px auto;
      background: #1c1729;
      padding: 25px;
      border-radius: 18px;
      border: 1px solid #382b50;
    }

    h1 {
      color: #b78aff;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      color: #bcb3ca;
      text-align: center;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      font-weight: bold;
      color: #e4d8ff;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #51416d;
      background: #100d19;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus, select:focus {
      border-color: #a66cff;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 24px;
      border: none;
      border-radius: 10px;
      background: #8b45e8;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      display: none;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #c49aff;
      text-decoration: none;
    }

    .note {
      color: #bcb3ca;
      font-size: 12px;
      margin-top: 15px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Voltiva</h1>
    <p class="subtitle">Place your service order</p>

    <form id="orderForm" data-order-form>

      <label for="service">Choose Service</label>
      <select id="service" name="service" required>
        <option value="">Select service</option>
        <option value="airtime">Airtime</option>
        <option value="data">Data Bundles</option>
        <option value="cable">Cable TV</option>
        <option value="electricity">Electricity</option>
        <option value="boosting">Social Media Boosting</option>
      </select>

      <label for="provider">Choose Provider</label>
      <select id="provider" required>
        <option value="">Select provider</option>
      </select>

      <label for="product">Choose Product</label>
      <select id="product" required>
        <option value="">Select product</option>
      </select>

      <div id="meterArea" hidden>
        <label for="meterType">Meter Type</label>
        <select id="meterType">
          <option value="prepaid">Prepaid</option>
          <option value="postpaid">Postpaid</option>
        </select>
      </div>

      <label for="reference" id="referenceLabel">
        Phone Number / Customer Reference
      </label>
      <input
        id="reference"
        type="text"
        placeholder="Enter customer reference"
        required
      >

      <label for="amount">Amount (₦)</label>
      <input
        id="amount"
        name="amount"
        type="number"
        min="1"
        step="1"
        placeholder="Enter amount"
        required
      >

      <input type="hidden" name="product_code" id="productCode">
      <input type="hidden" name="customer_reference" id="customerReference">

      <button type="submit" id="submitButton">
        Submit Order
      </button>

      <div class="message" id="message" role="status"></div>
    </form>

    <p class="note">
      This form records an order request. It does not charge your account
      or confirm service delivery.
    </p>

    <a class="back" href="dashboard.html">← Back to Dashboard</a>
  </div>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://eoadvcorimdpriqzmcux.supabase.co";

    // Replace this first placeholder with your existing publishable key.
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_pikDlVHyj8WV-EBv7b2v0Q_YmW0v75i";

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    window.supabaseClient = supabaseClient;

    const service = document.getElementById("service");
    const provider = document.getElementById("provider");
    const product = document.getElementById("product");
    const reference = document.getElementById("reference");
    const amount = document.getElementById("amount");
    const productCode = document.getElementById("productCode");
    const customerReference =
      document.getElementById("customerReference");
    const meterArea = document.getElementById("meterArea");
    const meterType = document.getElementById("meterType");
    const referenceLabel =
      document.getElementById("referenceLabel");
    const form = document.getElementById("orderForm");
    const message = document.getElementById("message");
    const submitButton =
      document.getElementById("submitButton");

    const catalog = {
      airtime: {
        providers: {
          MTN: ["Airtime Top-up"],
          Airtel: ["Airtime Top-up"],
          Glo: ["Airtime Top-up"],
          "9mobile": ["Airtime Top-up"]
        }
      },
      data: {
        providers: {
          MTN: ["Data Bundle"],
          Airtel: ["Data Bundle"],
          Glo: ["Data Bundle"],
          "9mobile": ["Data Bundle"]
        }
      },
      cable: {
        providers: {
          GOtv: ["Subscription"],
          DStv: ["Subscription"],
          Startimes: ["Subscription"]
        }
      },
      electricity: {
        providers: {
          "Electricity Provider": ["Electricity Bill"]
        }
      },
      boosting: {
        providers: {
          TikTok: ["Followers", "Likes", "Views", "Shares", "Comments"],
          Instagram: ["Followers", "Likes", "Views", "Comments"],
          Facebook: ["Followers", "Likes", "Views", "Shares"],
          YouTube: ["Views", "Likes", "Subscribers"]
        }
      }
    };

    function fillSelect(element, values, firstText) {
      element.innerHTML = "";
      element.add(new Option(firstText, ""));

      values.forEach(value => {
        element.add(new Option(value, value));
      });
    }

    function updateProviders() {
      const selectedService = service.value;
      const providers = catalog[selectedService]
        ? Object.keys(catalog[selectedService].providers)
        : [];

      fillSelect(provider, providers, "Select provider");
      fillSelect(product, [], "Select product");

      meterArea.hidden = selectedService !== "electricity";

      if (selectedService === "boosting") {
        referenceLabel.textContent = "Social Media Profile URL / Username";
        reference.placeholder = "Enter your profile URL or username";
      } else if (selectedService === "cable") {
        referenceLabel.textContent = "Decoder / Smartcard Number";
        reference.placeholder = "Enter decoder number";
      } else if (selectedService === "electricity") {
        referenceLabel.textContent = "Meter Number";
        reference.placeholder = "Enter meter number";
      } else {
        referenceLabel.textContent = "Phone Number";
        reference.placeholder = "Enter phone number";
      }
    }

    service.addEventListener("change", updateProviders);

    provider.addEventListener("change", () => {
      const options = catalog[service.value]?.providers[provider.value] || [];
      fillSelect(product, options, "Select product");
    });

    const params = new URLSearchParams(window.location.search);
    const requestedService = params.get("service");

    if (requestedService && catalog[requestedService]) {
      service.value = requestedService;
      updateProviders();
    }

    await import("./app.js");

    const { data: { session }, error } =
      await supabaseClient.auth.getSession();

    if (error || !session) {
      message.style.display = "block";
      message.style.background = "#542d35";
      message.textContent =
        "Please sign in before placing an order.";
      submitButton.disabled = true;
    }

    // Runs before the app.js document-level submit handler.
    form.addEventListener("submit", () => {
      const selectedService = service.value;
      const selectedProvider = provider.value;
      const selectedProduct = product.value;
      const enteredReference = reference.value.trim();

      productCode.value =
        selectedService + "_" +
        selectedProvider.toLowerCase().replace(/[^a-z0-9]+/g, "_") +
        "_" +
        selectedProduct.toLowerCase().replace(/[^a-z0-9]+/g, "_");

      customerReference.value = enteredReference;

      if (selectedService === "electricity") {
        customerReference.value =
          enteredReference + " (" + meterType.value + ")";
      }
    });

    window.addEventListener("voltiva-order-result", event => {
      message.style.display = "block";
      message.style.background =
        event.detail.success ? "#204b37" : "#542d35";
      message.textContent = event.detail.message;
    });
  </script>
</body>
</html>
