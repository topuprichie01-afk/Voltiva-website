
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voltiva | Sign Up</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f3f7ff;min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:white;padding:28px;border-radius:15px;width:100%;max-width:400px;box-shadow:0 5px 25px #0001}
h1{text-align:center;color:#0866d9;margin-bottom:10px}
p{text-align:center;color:#666;margin:12px 0}
label{display:block;font-weight:bold;margin:15px 0 7px}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:100%;padding:14px;margin-top:18px;background:#0866d9;color:white;border:0;border-radius:8px;font-weight:bold;font-size:16px}
#message{overflow-wrap:anywhere}
a{color:#0866d9;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h1>Voltiva</h1>
<p>Create your account</p>

<form id="signup-form">
<label for="email">Email address</label>
<input id="email" type="email" required placeholder="Enter your email">

<label for="password">Password</label>
<input id="password" type="password" minlength="6" required placeholder="Create a password">

<button id="signup-button" type="submit">Create Account</button>
</form>

<div id="verify-area" hidden>
<p>Enter the verification code sent to your email.</p>
<label for="token">Email verification code</label>
<input id="token" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter code">
<button id="verify-button" type="button">Verify Email</button>
</div>

<p id="message" role="status" aria-live="polite"></p>
<p>Already have an account? <a href="login.html">Log in</a></p>
</div>

<script type="module">
import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://eoadvcorimdpriqzmcux.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_pikDlVHyj8WV-EBv7b2v0Q_YmW0v75i";
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const form = document.getElementById("signup-form");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const message = document.getElementById("message");
const signupButton = document.getElementById("signup-button");
const verifyArea = document.getElementById("verify-area");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  signupButton.disabled = true;
  message.textContent = "Creating your account...";

  try {
    const email = emailInput.value.trim();
    const { data, error } = await supabase.auth.signUp({
      email,
      password: passwordInput.value
    });

    if (error) throw error;

    if (data.session) {
      message.textContent = "Account created successfully!";
      window.location.href = "dashboard.html";
      return;
    }

    verifyArea.hidden = false;
    form.hidden = true;
    message.textContent = "Check your email for your verification code.";
  } catch (error) {
    message.textContent = error.message || "Signup failed.";
    signupButton.disabled = false;
  }
});

document.getElementById("verify-button").addEventListener("click", async () => {
  const token = document.getElementById("token").value.trim();
  const email = emailInput.value.trim();
  const verifyButton = document.getElementById("verify-button");

  if (!token) {
    message.textContent = "Enter the code sent to your email.";
    return;
  }

  verifyButton.disabled = true;
  message.textContent = "Verifying your email...";

  try {
    const { data, error } = await supabase.auth.verifyOtp({
      email,
      token,
      type: "signup"
    });

    if (error) throw error;
    if (!data.session) throw new Error("Verification succeeded but no login session was created.");

    message.textContent = "Email verified! Opening your dashboard...";
    window.location.href = "dashboard.html";
  } catch (error) {
    message.textContent = error.message || "Verification failed.";
    verifyButton.disabled = false;
  }
});
</script>
</body>
</html>
