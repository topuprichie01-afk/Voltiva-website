<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Login | Voltiva</title>

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      min-height: 100vh;

      display: grid;

      place-items: center;

      padding: 20px;

      background: #0b1220;

      color: #f8fafc;

      font-family: Arial, sans-serif;

    }

    .card {

      width: 100%;

      max-width: 400px;

      padding: 28px;

      border: 1px solid #263449;

      border-radius: 18px;

      background: #121d30;

    }

    h1 { margin-bottom: 8px; }

    .muted { color: #a8b6ca; line-height: 1.5; }

    label { display: block; margin: 18px 0 7px; }

    input {

      width: 100%;

      padding: 13px;

      border-radius: 8px;

      border: 1px solid #40516a;

      background: #0b1220;

      color: white;

      font-size: 16px;

    }

    button {

      width: 100%;

      padding: 14px;

      margin-top: 20px;

      border: 0;

      border-radius: 8px;

      background: #39d98a;

      color: #07140d;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }

    button:disabled { opacity: .6; }

    a { color: #67e8b1; }

    #message { overflow-wrap: anywhere; }

  </style>

</head>

<body>

  <main class="card">

    <h1>Welcome back</h1>

    <p class="muted">Log in to your Voltiva account.</p>

    <form id="login-form">

      <label for="email">Email address</label>

      <input id="email" type="email" autocomplete="email"

        placeholder="you@example.com" required>

      <label for="password">Password</label>

      <input id="password" type="password"

        autocomplete="current-password"

        placeholder="Your password" required>

      <button id="login-button" type="submit">Log In</button>

    </form>

    <p id="message" class="muted" role="status"></p>

    <p id="dashboard" hidden>

      You are logged in! Your customer account is ready.

    </p>

    <button id="logout-button" type="button" hidden>Log Out</button>

    <p>New to Voltiva? <a href="signup.html">Create an account</a></p>

    <p><a href="index.html">Back to homepage</a></p>

  </main>

  <script type="module">

    import { createClient } from

      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =  "https://eoadvcorimdpriqzmcux.supabase.co";

    // Use your PUBLIC Publishable key, never your Secret key.

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_pikDlVHyj8WV-EBv7b2v0Q_YmW0v75i";

    const SUPABASE_URL = "https://eoadvcorimdpriqzmcux.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_pikDlVHyj8WV-EBv7b2v0Q_YmW0v75i";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

    const form = document.getElementById("login-form");

    const message = document.getElementById("message");

    const button = document.getElementById("login-button");

    const dashboard = document.getElementById("dashboard");

    const logoutButton = document.getElementById("logout-button");

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      message.textContent = "";

      button.disabled = true;

      button.textContent = "Logging in...";

      try {

        const { data, error } = await supabase.auth.signInWithPassword({

          email: document.getElementById("email").value.trim(),

          password: document.getElementById("password").value

        });

        if (error) throw error;

        message.textContent = "Login successful!";
        window.location.href = "dashboard.html";
        dashboard.hidden = false;

        dashboard.textContent =

          "Logged in as " + data.user.email;

        logoutButton.hidden = false;

        form.hidden = true;

      } catch (error) {

        message.textContent = error.message ||

          "Login failed. Please check your details.";

      } finally {

        button.disabled = false;

        button.textContent = "Log In";

      }

    });

    logoutButton.addEventListener("click", async () => {

      const { error } = await supabase.auth.signOut();

      if (error) {

        message.textContent = error.message;

        return;

      }

      form.hidden = false;

      dashboard.hidden = true;

      logoutButton.hidden = true;

      message.textContent = "You have logged out.";

    });

  </script>

</body>

</html>
