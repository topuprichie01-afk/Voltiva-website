
<script type="module">
  let supabase;
  let currentUser = null;
  let allOrders = [];
  let walletTransactions = [];

  // ENTER YOUR SUPABASE DETAILS HERE
  const SUPABASE_URL = "https://eoadvcorimdpriqzmcux.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_pikDlVHyj8WV-EBv7b2v0Q_YmW0v75i";

  const $ = id => document.getElementById(id);

  const money = value => new Intl.NumberFormat("en-NG", {
    style: "currency",
    currency: "NGN",
    maximumFractionDigits: 2
  }).format(Number(value || 0));

  const safe = value => String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));

  const dateText = value => {
    if (!value) return "Date unavailable";
    const date = new Date(value);
    return Number.isNaN(date.getTime())
      ? "Date unavailable"
      : date.toLocaleString("en-NG", {
          dateStyle: "medium",
          timeStyle: "short"
        });
  };

  function showNotice(message, kind = "info") {
    const el = $("notice");
    if (!el) return;
    el.textContent = message;
    el.className = `notice show ${kind}`;
    clearTimeout(showNotice.timer);
    showNotice.timer = setTimeout(
      () => el.classList.remove("show"), 4500
    );
  }

  function switchPage(page) {
    document.querySelectorAll("[data-view]").forEach(el => {
      el.classList.toggle("active", el.dataset.view === page);
    });

    document.querySelectorAll("[data-nav]").forEach(el => {
      el.classList.toggle("active", el.dataset.nav === page);
    });

    const headings = {
      overview: "Overview",
      transactions: "Transactions",
      orders: "Order tracking",
      wallet: "My wallet",
      profile: "Account settings"
    };

    $("pageHeading").textContent = headings[page] || "Overview";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function statusPill(value) {
    const status = String(value || "pending").toLowerCase();
    const allowed = [
      "pending", "processing", "completed", "successful", "failed"
    ];
    const key = allowed.includes(status)
      ? (status === "successful" ? "completed" : status)
      : "pending";

    const label = key === "completed"
      ? "Successful"
      : key.charAt(0).toUpperCase() + key.slice(1);

    return `<span class="status ${key}">${label}</span>`;
  }

  function renderOrder(order) {
    return `
      <article class="activity-row">
        <div class="activity-symbol">▣</div>
        <div class="activity-main">
          <strong>${safe(order.service || "Service order")}</strong>
          <small>Order #${safe(order.id)} · ${safe(dateText(order.created_at))}</small>
        </div>
        <div class="activity-end">
          <strong>${money(order.amount)}</strong>
          ${statusPill(order.status)}
        </div>
      </article>`;
  }

  function renderWalletTransaction(tx) {
    const label = tx.description || tx.type ||
      tx.transaction_type || "Wallet activity";

    return `
      <article class="activity-row">
        <div class="activity-symbol wallet-symbol">↕</div>
        <div class="activity-main">
          <strong>${safe(label)}</strong>
          <small>${safe(dateText(tx.created_at))}</small>
        </div>
        <div class="activity-end">
          <strong>${money(tx.amount)}</strong>
          ${statusPill(tx.status || "completed")}
        </div>
      </article>`;
  }

  async function loadOrders() {
    const { data, error } = await supabase
      .from("orders")
      .select("id,service,amount,status,created_at,product_code,customer_reference")
      .eq("user_id", currentUser.id)
      .order("created_at", { ascending: false });

    if (error) {
      console.error("Orders:", error);
      $("recentOrders").innerHTML =
        '<p class="empty">Orders could not be loaded.</p>';
      $("allOrders").innerHTML =
        '<p class="empty">Orders could not be loaded.</p>';
      $("trackingOrders").innerHTML =
        '<p class="empty">Order tracking could not be loaded.</p>';
      return;
    }

    allOrders = data || [];

    const total = allOrders.length;
    const pending = allOrders.filter(order =>
      ["pending", "processing"].includes(
        String(order.status).toLowerCase()
      )
    ).length;

    const completed = allOrders.filter(order =>
      ["completed", "successful"].includes(
        String(order.status).toLowerCase()
      )
    ).length;

    $("orderCount").textContent = total;
    $("pendingCount").textContent = pending;
    $("completedCount").textContent = completed;

    $("orderCountCopy").textContent = total;
    $("pendingCountCopy").textContent = pending;
    $("completedCountCopy").textContent = completed;

    const orderHTML = allOrders.map(renderOrder).join("");

    $("recentOrders").innerHTML = total
      ? allOrders.slice(0, 4).map(renderOrder).join("")
      : '<p class="empty">Your recent orders will appear here.</p>';

    $("allOrders").innerHTML = total
      ? orderHTML
      : '<p class="empty">You have not placed an order yet.</p>';

    $("trackingOrders").innerHTML = total
      ? orderHTML
      : '<p class="empty">You do not have any orders to track yet.</p>';

    $("lastUpdated").textContent =
      "Updated " + new Date().toLocaleTimeString("en-NG");
  }

  async function loadWallet() {
    const { data, error } = await supabase
      .from("wallets")
      .select("*")
      .eq("user_id", currentUser.id)
      .maybeSingle();

    if (error) {
      console.error("Wallet:", error);
      $("walletBalance").textContent = "Unavailable";
      $("homeBalance").textContent = "Unavailable";
      $("walletHelp").textContent =
        "We could not load your wallet. Please try again.";
      return;
    }

    const balance = Number(data?.balance || 0);

    $("walletBalance").textContent = money(balance);
    $("homeBalance").textContent = money(balance);

    $("walletHelp").textContent = data
      ? "Your wallet balance is loaded from your Voltiva account."
      : "Your wallet record has not been created yet.";
  }

  async function loadWalletActivity() {
    const { data, error } = await supabase
      .from("wallet_transactions")
      .select("*")
      .eq("user_id", currentUser.id)
      .order("created_at", { ascending: false })
      .limit(8);

    if (error) {
      console.error("Wallet activity:", error);
      $("walletActivity").innerHTML =
        '<p class="empty">Wallet activity could not be loaded.</p>';
      return;
    }

    walletTransactions = data || [];

    $("walletActivity").innerHTML = walletTransactions.length
      ? walletTransactions.map(renderWalletTransaction).join("")
      : '<p class="empty">Your wallet activity will appear here.</p>';
  }

  async function logout() {
    const { error } = await supabase.auth.signOut();

    if (error) {
      showNotice("Could not sign out. Please try again.", "error");
      return;
    }

    window.location.replace("login.html");
  }

  async function refreshDashboard() {
    await Promise.all([
      loadOrders(),
      loadWallet(),
      loadWalletActivity()
    ]);
    showNotice("Dashboard refreshed.", "success");
  }

  async function start() {
    const loading = $("loadingState");

    if (!SUPABASE_PUBLISHABLE_KEY ||
        SUPABASE_PUBLISHABLE_KEY.includes("PASTE_YOUR_")) {
      loading.textContent =
        "Please enter your Supabase publishable key in dashboard.html.";
      return;
    }

    try {
      loading.textContent = "Connecting securely to Voltiva...";

      const module = await import(
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      );

      supabase = module.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

      const { data, error } = await supabase.auth.getSession();

      if (error) throw error;

      if (!data.session) {
        window.location.replace("login.html");
        return;
      }

      currentUser = data.session.user;

      const email = currentUser.email || "Voltiva customer";

      $("welcomeName").textContent = email.split("@")[0];
      $("accountEmail").textContent = email;
      $("accountInitial").textContent =
        (email[0] || "V").toUpperCase();

      $("loadingState").hidden = true;
      $("dashboardContent").hidden = false;

      await Promise.all([
        loadOrders(),
        loadWallet(),
        loadWalletActivity()
      ]);

    } catch (error) {
      console.error("Dashboard startup error:", error);
      loading.hidden = false;
      loading.textContent =
        "Dashboard could not connect. Check your internet connection and Supabase settings, then refresh.";
      showNotice("Dashboard connection failed.", "error");
    }
  }

  document.querySelectorAll("[data-nav]").forEach(button => {
    button.addEventListener("click", () => {
      switchPage(button.dataset.nav);
    });
  });

  $("logoutButton").addEventListener("click", logout);
  $("profileLogout").addEventListener("click", logout);
  $("refreshButton").addEventListener("click", refreshDashboard);

  $("fundButton").addEventListener("click", () => {
    $("fundModal").showModal();
  });

  $("closeFundModal").addEventListener("click", () => {
    $("fundModal").close();
  });

  $("fundForm").addEventListener("submit", event => {
    event.preventDefault();
    $("fundModal").close();
    showNotice(
      "Wallet funding is not enabled yet. No payment has been started."
    );
  });

  $("fundButtonWallet").addEventListener("click", () => {
    $("fundModal").showModal();
  });

  start();
</script>
