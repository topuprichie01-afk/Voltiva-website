<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Voltiva</title>

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      min-height: 100vh;

      display: grid;

      place-items: center;

      padding: 20px;

      background: #0b1220;

      color: #f8fafc;

      font-family: Arial, sans-serif;

    }

    .card {

      width: 100%;

      max-width: 400px;

      padding: 28px;

      border: 1px solid #263449;

      border-radius: 18px;

      background: #121d30;

    }

    h1 { margin-bottom: 8px; }

    .muted { color: #a8b6ca; line-height: 1.5; }

    label { display: block; margin: 18px 0 7px; }

    input {

      width: 100%;

      padding: 13px;

      border-radius: 8px;

      border: 1px solid #40516a;

      background: #0b1220;

      color: white;

      font-size: 16px;

    }

    button {

      width: 100%;

      padding: 14px;

      margin-top: 20px;

      border: 0;

      border-radius: 8px;

      background: #39d98a;

      color: #07140d;

      font-size: 16px;

      font-weight: bold;

    }

    #message { overflow-wrap: anywhere; }

    a { color: #67e8b1; }

  </style>

</head>

<body>

  <main class="card">

    <h1>Create your account</h1>

    <p class="muted">Join Voltiva to access our services.</p>

    <form id="signup-form">

      <label for="email">Email address</label>

      <input id="email" type="email" autocomplete="email"

        placeholder="you@example.com" required>

      <label for="password">Password</label>

      <input id="password" type="password"

        autocomplete="new-password" minlength="8"

        placeholder="At least 8 characters" required>

      <button id="signup-button" type="submit">

        Create Account

      </button>

    </form>

    <p id="message" class="muted" role="status"></p>

    <p>Already registered? <a href="login.html">Log in</a></p>

    <p><a href="index.html">Back to homepage</a></p>

  </main>

  <script type="module">

    import { createClient } from

      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =

      "https://eoadvcorimdpriqzmcux.supabase.co";

    // Replace this placeholder with your Publishable key.

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_pikDlVHyj8WV-EBv7b2v0Q_YmW0v75i";

    const supabase = createClient(

      SUPABASE_URL,

      SUPABASE_PUBLISHABLE_KEY

    );

    const form = document.getElementById("signup-form");

    const message = document.getElementById("message");

    const button = document.getElementById("signup-button");

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      message.textContent = "";

      const email = document.getElementById("email").value.trim();

      const password = document.getElementById("password").value;

      if (SUPABASE_PUBLISHABLE_KEY ===

          "PASTE_YOUR_PUBLISHABLE_KEY_HERE") {

        message.textContent =

          "Setup needed: add your Supabase Publishable key first.";

        return;

      }

      button.disabled = true;

      button.textContent = "Creating account...";

      try {

        const { data, error } = await supabase.auth.signUp({

          email,

          password,

          options: {

            emailRedirectTo: window.location.origin +

              window.location.pathname.replace(/signup\.html$/, "")

          }

        });

        if (error) throw error;

        if (data.session) {

          message.textContent =

            "Account created! You can now log in.";

        } else {

          message.textContent =

            "Account request received. Check your email for a confirmation link before logging in.";

        }

      } catch (error) {

        message.textContent = error.message ||

          "Could not create your account. Please try again.";

      } finally {

        button.disabled = false;

        button.textContent = "Create Account";

      }

    });

  </script>

</body>

</html>
