
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voltiva | Reset Password</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f3f7ff;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0, 50, 120, 0.1);
    }

    .logo {
      text-align: center;
      color: #1266d6;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    h2 {
      text-align: center;
      color: #172b4d;
      margin-bottom: 10px;
    }

    .description {
      text-align: center;
      color: #68758a;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #26364d;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccd6e5;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #1266d6;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 9px;
      background: #1266d6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 17px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .success {
      color: #168044;
    }

    .error {
      color: #d52b35;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #1266d6;
      text-decoration: none;
      font-size: 14px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">VOLTIVA</div>

    <section id="request-section">
      <h2>Forgot Password?</h2>

      <p class="description">
        Enter your registered email address.
        We will send you a password recovery link.
      </p>

      <form id="request-form">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <button type="submit" id="send-button">
          Send Recovery Email
        </button>
      </form>
    </section>

    <section id="reset-section" hidden>
      <h2>Create New Password</h2>

      <p class="description">
        Enter your new Voltiva password below.
      </p>

      <form id="reset-form">
        <label for="new-password">New Password</label>
        <input
          type="password"
          id="new-password"
          placeholder="Enter new password"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <label for="confirm-password">Confirm New Password</label>
        <input
          type="password"
          id="confirm-password"
          placeholder="Confirm new password"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <button type="submit" id="reset-button">
          Update Password
        </button>
      </form>
    </section>

    <p id="message" role="status" aria-live="polite"></p>

    <a href="login.html" class="back">
      Back to Login
    </a>

  </div>

  <script type="module">

    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://eoadvcorimdpriqzmcux.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_pikDlVHyj8WV-EBv7b2v0Q_YmW0v75i";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const requestSection =
      document.getElementById("request-section");

    const resetSection =
      document.getElementById("reset-section");

    const requestForm =
      document.getElementById("request-form");

    const resetForm =
      document.getElementById("reset-form");

    const message =
      document.getElementById("message");

    const sendButton =
      document.getElementById("send-button");

    const resetButton =
      document.getElementById("reset-button");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    // Listen for the password recovery link.
    const { data: authListener } =
      supabase.auth.onAuthStateChange((event, session) => {

        if (event === "PASSWORD_RECOVERY" && session) {
          requestSection.hidden = true;
          resetSection.hidden = false;

          showMessage(
            "Recovery verified. You can now create a new password.",
            "success"
          );
        }

      });

    // Send recovery email.
    requestForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      showMessage("", "");

      sendButton.disabled = true;
      sendButton.textContent = "Sending...";

      try {

        const email =
          document.getElementById("email").value.trim();

        const redirectUrl =
          window.location.origin + window.location.pathname;

        const { error } =
          await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: redirectUrl
          });

        if (error) throw error;

        showMessage(
          "If an account exists for this email, a recovery email will be sent. Check your inbox and spam folder.",
          "success"
        );

      } catch (error) {

        showMessage(
          error.message || "Could not send recovery email.",
          "error"
        );

      } finally {

        sendButton.disabled = false;
        sendButton.textContent = "Send Recovery Email";

      }

    });

    // Update password after recovery link is verified.
    resetForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      showMessage("", "");

      const password =
        document.getElementById("new-password").value;

      const confirmPassword =
        document.getElementById("confirm-password").value;

      if (password.length < 8) {
        showMessage(
          "Password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "Passwords do not match.",
          "error"
        );
        return;
      }

      resetButton.disabled = true;
      resetButton.textContent = "Updating Password...";

      try {

        const { error } =
          await supabase.auth.updateUser({
            password: password
          });

        if (error) throw error;

        showMessage(
          "Your password has been updated successfully!",
          "success"
        );

        resetForm.reset();

        await supabase.auth.signOut();

        setTimeout(() => {
          window.location.href = "login.html";
        }, 2000);

      } catch (error) {

        showMessage(
          error.message || "Password update failed.",
          "error"
        );

        resetButton.disabled = false;
        resetButton.textContent = "Update Password";

      }

    });

  </script>

</body>
</html>
